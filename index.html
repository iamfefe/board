
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可愛留言板</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');
    
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .board-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 15px 25px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
      /* 上下浮動動畫 */
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    h1 {
      color: #ff8ca3;
      margin-bottom: 20px;
      font-size: 28px;
    }

    input, textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border: 2px solid #ffd1dc;
      border-radius: 15px;
      box-sizing: border-box;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #ff8ca3;
    }

    textarea {
      resize: none;
      height: 120px;
    }

    button {
      background: #ff8ca3;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      background: #ff6b8b;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="board-container">
    <h1>✨ 留個言吧 ✨</h1>
    <form id="messageForm">
      <input type="text" name="name" id="name" placeholder="你的名字" required>
      <textarea name="message" id="message" placeholder="想說些什麼呢？" required></textarea>
      <button type="submit" id="submitBtn">送出留言 🚀</button>
    </form>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwIHbdkMsbbqDRvvll_NsdcepqEGQuH_PKVVFiFdpA/dev';
    const form = document.getElementById('messageForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.textContent = '傳送中... 💫';
      submitBtn.disabled = true;

      let formData = new FormData(form);

      // 使用 no-cors 模式避免跨網域錯誤
      fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' })
        .then(() => {
          alert("留言成功！已經送到試算表囉 🎉");
          form.reset();
          submitBtn.textContent = '送出留言 🚀';
          submitBtn.disabled = false;
        })
        .catch(error => {
          alert("哎呀，發生錯誤了 😢");
          submitBtn.textContent = '重新送出';
          submitBtn.disabled = false;
        });
    });
  </script>
</body>
</html>
